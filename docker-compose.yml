services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: campus_lost_found
      DB_USER: lostfound
      DB_PASS: lostfound_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/uploads

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_lost_found
      MYSQL_USER: lostfound
      MYSQL_PASSWORD: lostfound_pass
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uploads:
  dbdata:
# docker-compose.yml — starts the website AND its database with one command:
#     docker compose up --build
# then open http://localhost:8080

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:               # read by db.php
      DB_HOST: db
      DB_NAME: campus_lost_found
      DB_USER: lostfound
      DB_PASS: lostfound_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/uploads   # uploaded photos survive restarts

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: campus_lost_found
      MYSQL_USER: lostfound
      MYSQL_PASSWORD: lostfound_pass
    volumes:
      - dbdata:/var/lib/mysql                                       # data survives restarts
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro      # creates the tables on first start
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uploads:
  dbdata:
